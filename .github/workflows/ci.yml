name: VORTEX CI
on:
  push:
    branches: [main, feat/vortex-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vortex tests
      - name: Tests
        run: python -m pytest -q
      - name: Smoke CLI
        run: python -m vortex.cli status
