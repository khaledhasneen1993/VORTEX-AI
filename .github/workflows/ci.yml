name: VORTEX canonical main

on:
  push:
    branches: [main]

concurrency:
  group: vortex-main-approved
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vortex tests
      - name: Fatal-code lint
        run: python -m ruff check --select E9,F63,F7,F82 vortex tests
      - name: Dependency consistency
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q
      - name: Smoke CLI
        run: python -m vortex.cli status

  prune-old-runs-and-branches:
    needs: [quality]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: Preserve newest main build and delete older workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' > "$RUNNER_TEMP/prunable_run_ids"
          total=0
          failed=0
          while IFS= read -r old_run; do
            [[ -z "$old_run" || "$old_run" == "$GITHUB_RUN_ID" ]] && continue
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$old_run" >/dev/null; then
              total=$((total+1))
            else
              echo "Could not delete workflow run $old_run" >&2
              failed=$((failed+1))
            fi
          done < "$RUNNER_TEMP/prunable_run_ids"
          echo "Removed $total previous workflow runs; failures=$failed."
          test "$failed" -eq 0
