name: VORTEX 50pct doc/test PR verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vortex tests
      - name: Fatal lint
        run: python -m ruff check --select E9,F63,F7,F82 vortex tests
      - name: Dependency check
        run: python -m pip check
      - name: Test suite
        run: python -m pytest -q
      - name: Smoke CLI
        run: python -m vortex.cli status
