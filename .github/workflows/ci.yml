name: VORTEX canonical main

on:
  push:
    branches: [main]

concurrency:
  group: vortex-main-approved
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vortex tests
      - name: Fatal-code lint
        run: python -m ruff check --select E9,F63,F7,F82 vortex tests
      - name: Dependency consistency
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q
      - name: Smoke CLI
        run: python -m vortex.cli status

  prune-old-runs-and-branches:
    needs: [quality]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: Remove only verified merged work branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for pr in 5 6 7 8; do
            meta=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")
            merged=$(echo "$meta" | jq -r '.merged')
            branch=$(echo "$meta" | jq -r '.head.ref')
            expected=$(echo "$meta" | jq -r '.head.sha')
            if [[ "$merged" != "true" || -z "$branch" || "$branch" == "main" ]]; then
              continue
            fi
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)
            if [[ -n "$actual" && "$actual" == "$expected" ]]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "Deleted merged unchanged branch $branch"
            elif [[ -n "$actual" ]]; then
              echo "Preserving branch $branch because it changed after merge"
            fi
          done

      - name: Preserve newest main build and delete older workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' > "$RUNNER_TEMP/prunable_run_ids"
          total=0
          failed=0
          while IFS= read -r old_run; do
            [[ -z "$old_run" || "$old_run" == "$GITHUB_RUN_ID" ]] && continue
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$old_run" >/dev/null; then
              total=$((total+1))
            else
              echo "Could not delete workflow run $old_run" >&2
              failed=$((failed+1))
            fi
          done < "$RUNNER_TEMP/prunable_run_ids"
          echo "Removed $total previous workflow runs; failures=$failed."
          test "$failed" -eq 0
