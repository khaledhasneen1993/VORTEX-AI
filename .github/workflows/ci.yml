name: VORTEX-AI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vortex-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install approved project
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vortex tests research
      - name: Check code
        run: python -m ruff check --select E9,F63,F7,F82 vortex tests research
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test PAPER CLI
        run: python -m vortex.cli status
