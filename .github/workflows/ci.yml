name: VORTEX-AI Current Basket — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vortex-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Set false to retain completed historical runs instead of pruning them.
env:
  KEEP_LATEST_SUCCESSFUL_BUILD: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install approved project
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vortex tests
      - name: Check code
        run: python -m ruff check --select E9,F63,F7,F82 vortex tests
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test PAPER CLI
        run: python -m vortex.cli status

  prune-old-runs:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Keep current successful main build only
        if: env.KEEP_LATEST_SUCCESSFUL_BUILD == 'true'
        # A cleanup outage must not turn passing project tests into a failure.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.status == \"completed\" and .id < $KEEP_RUN) | .id" \
            > "$RUNNER_TEMP/vortex-old-runs.txt"
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id"
            echo "Deleted completed old run $run_id; keeping $KEEP_RUN"
          done < "$RUNNER_TEMP/vortex-old-runs.txt"
