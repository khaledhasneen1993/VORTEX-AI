name: VORTEX-AI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vortex-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install approved project
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vortex tests research
      - name: Check code
        run: python -m ruff check --select E9,F63,F7,F82 vortex tests research
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test PAPER CLI
        run: python -m vortex.cli status

      - name: Prune completed legacy Actions runs (one-time, approved housekeeping)
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.event.head_commit.message == 'chore: prune legacy Actions runs [one-off]'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t LEGACY_IDS < <(
            gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed" and (.name == "VORTEX 0.2 quality" or (.name | startswith("Phase 0")))) | .id'
          )
          echo "Legacy completed runs marked for cleanup: ${#LEGACY_IDS[@]}"
          for rid in "${LEGACY_IDS[@]}"; do
            test "$rid" != "$GITHUB_RUN_ID"
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$rid" >/dev/null
            echo "Deleted retired research/build run $rid"
          done
          echo "Legacy run removal complete. Current Build & Test run retained." >> "$GITHUB_STEP_SUMMARY"
