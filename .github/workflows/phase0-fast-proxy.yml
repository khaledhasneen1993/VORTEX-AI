name: Phase 0 FAST 30 and 90-day OHLC proxy (NOT executable PnL)

on:
  push:
    branches: [research/phase0-baseline]
    paths:
      - '.github/workflows/phase0-fast-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortex-fast-ohlc-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  price-only-scenarios:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, DOGEUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUN_MODE: backtest
      SYMBOLS: ${{ matrix.symbol }}
      STARTING_EQUITY: '1000'
      VORTEX_SIGNAL_AUDIT: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and run synthetic no-acceptance tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_phase0_price_proxy.py
          python -m ruff check --select E9,F63,F7,F82 research/phase0_price_proxy.py tests/test_phase0_price_proxy.py
      - name: Genuine current filters (historical validity is UNKNOWN)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/ohlcv "runs/fast-proxy/${{ matrix.symbol }}"
          cp research/baselines/user-20261010/exchange_info_six.json data/ohlcv/exchange_info.json
          sha256sum data/ohlcv/exchange_info.json > "runs/fast-proxy/${{ matrix.symbol }}/filter-snapshot.sha256"
      - name: Official checksum-verified Binance Vision OHLC history
        shell: bash
        run: |
          set -euo pipefail
          python -m research.download_ohlcv \
            --symbols ${{ matrix.symbol }} --intervals 1m 5m 15m 1h \
            --start 2026-07-01 --end 2026-10-09 \
            --output data/ohlcv \
            > "runs/fast-proxy/${{ matrix.symbol }}/download.log" 2>&1
          tail -n 5 "runs/fast-proxy/${{ matrix.symbol }}/download.log"
      - name: Run unchanged signal/exit engine in ISOLATED price-only research proxy
        shell: bash
        run: |
          set -euo pipefail
          for days in 30 90; do
            python -m research.phase0_price_proxy \
              --ohlcv-dir data/ohlcv \
              --symbol ${{ matrix.symbol }} \
              --days "$days" --end-utc 2026-10-09 \
              --output "runs/fast-proxy/${{ matrix.symbol }}/proxy-${days}d.json" \
              > "runs/fast-proxy/${{ matrix.symbol }}/proxy-${days}d.stdout.json"
          done
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("runs/fast-proxy/${{ matrix.symbol }}")
          summary=["# IMPORTANT: OHLC-only hypothetical scenarios; NOT executable PnL", "",
                   "Historical funding/depth vetoes and real fills are UNKNOWN; economic Phase 0 remains INCOMPLETE.", ""]
          for days in (30,90):
              r=json.loads((root/f"proxy-{days}d.json").read_text())
              for scenario,metrics in r["scenarios"].items():
                  summary.append(f"- {r['symbol']} {days} days {scenario}: modeled closed={metrics['closed_trades']}; modeled PF={metrics['profit_factor_model']}; modeled drawdown={metrics['max_drawdown_pct_model']}%; virtual wallet={metrics['final_wallet_virtual']}")
          (root/"README.txt").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],"a") as f:f.write("\n".join(summary)+"\n")
          PY
      - name: Save scenario evidence, error logs and full hypothetical trade tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-ohlc-proxy-${{ matrix.symbol }}
          path: runs/fast-proxy/${{ matrix.symbol }}/
          if-no-files-found: warn
          retention-days: 30
