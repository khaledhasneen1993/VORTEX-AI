name: VORTEX 0.2 quality

on:
  push:
    branches: [main, research/hourly-development]

concurrency:
  group: vortex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q vortex tests research
      - name: Fatal-code lint
        run: python -m ruff check --select E9,F63,F7,F82 vortex tests research
      - name: Dependency consistency
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q
      - name: Smoke CLI
        run: python -m vortex.cli status

